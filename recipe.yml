            slot_definitions: null
    system.site:
      simpleConfigUpdate:
        page.front: /home
    system.theme:
      simpleConfigUpdate:
        default: vartheme_bs5_educare
    # The contact form lives in a Canvas page. There its Ajax submit gets the
    # whole page back and shows "Oops, something went wrong", and a redirect
    # confirmation throws inside the component and renders as an error. Submit
    # normally and confirm inline, in place of the form.
    webform.webform.business_contact:
      simpleConfigUpdate:
        settings.ajax: false
        settings.confirmation_type: inline
        settings.confirmation_message: 'Thank you for contacting us. We will get back to you soon.'
    user.role.anonymous:
      grantPermissions:
        - 'view terms in news_categories'
        - 'view term names in news_categories'
        - 'view terms in degrees'
        - 'view term names in degrees'
        - 'view terms in study_level'
        - 'view term names in study_level'
        - 'view terms in program_type'
        - 'view term names in program_type'
    user.role.authenticated:
      grantPermissions:
        - 'view terms in news_categories'
        - 'view term names in news_categories'
        - 'view terms in degrees'
        - 'view term names in degrees'
        - 'view terms in study_level'
        - 'view term names in study_level'
        - 'view terms in program_type'
        - 'view term names in program_type'
    user.role.content_editor:
      grantPermissions:
        - 'create program content'
        - 'delete any program content'
        - 'delete own program content'
        - 'edit any program content'
        - 'edit own program content'
        - 'view program revisions'
        - 'create terms in degrees'
        - 'create terms in program_type'
        - 'select terms in degrees'
        - 'select terms in program_type'
        - 'select terms in study_level'
        - 'administer brand kit'
    user.role.content_admin:
      grantPermissions:
