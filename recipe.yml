name: Educare
type: Site
description: A site template recipe for education websites, built the Varbase recipe-first way.
recipes:
- varbase_users_base
- drupal_cms_admin_ui
- drupal_cms_anti_spam
- drupal_cms_authentication
- drupal_cms_forms
- drupal_cms_media
- drupal_cms_privacy_basic
- drupal_cms_seo_basic
- drupal_cms_seo_tools
- drupal_cms_accessibility_tools
- drupal_cms_search
- easy_email_express
- varbase_admin_base
- varbase_security_base
- varbase_media_base
- varbase_editor_base
- varbase_content_base
- varbase_workflow_base
- varbase_seo_base
- varbase_webform_base
- varbase_page_base
- varbase_news_base
- varbase_events_base
- varbase_performance_base
install:
- vartheme_bs5_educare
- better_exposed_filters
config:
  strict: false
  actions:
    system.site:
      simpleConfigUpdate:
        page.front: /home
    system.theme:
      simpleConfigUpdate:
        default: vartheme_bs5_educare
    user.role.anonymous:
      grantPermissions:
        - 'view terms in news_categories'
        - 'view term names in news_categories'
    user.role.authenticated:
      grantPermissions:
        - 'view terms in news_categories'
        - 'view term names in news_categories'
    gin.settings:
      simpleConfigUpdate:
        logo:
          use_default: false
          path: themes/contrib/vartheme_bs5_educare/logo-icon.svg
        favicon:
          use_default: false
          mimetype: image/vnd.microsoft.icon
          path: themes/contrib/vartheme_bs5_educare/favicon.ico
    gin_login.settings:
      simpleConfigUpdate:
        logo:
          use_default: false
          path: themes/contrib/vartheme_bs5_educare/logo.svg
    navigation.settings:
      simpleConfigUpdate:
        logo:
          provider: custom
          path: themes/contrib/vartheme_bs5_educare/logo-icon.svg
          max:
            filesize: 1048576
            height: 40
            width: 40
    package_manager.settings:
      simpleConfigUpdate:
        additional_trusted_composer_plugins:
        - vardot/varbase
        - drupal/educare
        - composer/installers
        - cweagans/composer-patches
        - oomphinc/composer-installers-extender
        - drupal/core-composer-scaffold
        - drupal/core-project-message
        - dealerdirect/phpcodesniffer-composer-installer
        - phpstan/extension-installer
        - php-http/discovery
        - tbachert/spi
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            uri: https://git.drupalcode.org/api/v4/projects/201141/repository/files/recommended.yml/raw?ref=HEAD
            ttl: 1
          drupalorg_jsonapi: []
          varbase_recipes: []
        default_source: recommended
    ckeditor_media_embed.settings:
      setCKEditorMediaEmbedVersion: true
    klaro.texts:
      simpleConfigUpdate:
        consentModal.privacyPolicy.url: internal:/privacy
    views.view.news:
      simpleConfigUpdate:
        display.all.display_options.style.options.component_id: vartheme_bs5_educare:grid
