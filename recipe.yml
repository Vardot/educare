name: Educare
type: Site
description: 'Designed for schools, universities and colleges, this template features ready-made pages for programs, admissions and student life, with program, news and event content, search and a contact form.'
recipes:
- varbase_users_base
- drupal_cms_anti_spam
- drupal_cms_authentication
- drupal_cms_forms
- drupal_cms_seo_basic
- drupal_cms_seo_tools
- drupal_cms_accessibility_tools
- easy_email_express
- varbase_admin_base
- varbase_security_base
- varbase_media_base
- varbase_editor_base
- varbase_content_base
- drupal_cms_search
- varbase_search_base
- varbase_workflow_base
- varbase_seo_base
- varbase_webform_base
- varbase_page_base
- varbase_news_base
- varbase_events_base
- varbase_performance_base
install:
- vartheme_bs5_educare
- better_exposed_filters
- canvas_page_template_component
config:
  strict: false
  actions:
    # Canvas makes a component for every block as soon as the block exists, and
    # labels it in the install language, so on a non-English install a component
    # Canvas made before this recipe has another version than the English one
    # the templates, patterns and regions pin. Keep the English version beside
    # it as an older version. Only blocks whose label is translated.
    canvas.component.block.system_breadcrumb_block:
      simpleConfigUpdate:
        versioned_properties.0d7e961dd03aa710:
          settings:
            default_settings:
              id: system_breadcrumb_block
              label: Breadcrumbs
              label_display: '0'
              provider: system
          fallback_metadata:
            slot_definitions: null
    canvas.component.block.webform_block:
      simpleConfigUpdate:
        versioned_properties.b5dca6ca0519bf1b:
          settings:
            default_settings:
              id: webform_block
              label: Webform
              label_display: '0'
              provider: webform
              webform_id: ''
              default_data: ''
              redirect: false
              lazy: false
          fallback_metadata:
            slot_definitions: null
    canvas.component.block.views_block.events-latest:
      simpleConfigUpdate:
        versioned_properties.6ed1e9aa7565cbad:
          settings:
            default_settings:
              id: views_block:events-latest
              label: Upcoming events
              label_display: '0'
              provider: views
              views_label: ''
              items_per_page: null
              exposed: {  }
          fallback_metadata:
            slot_definitions: null
    canvas.component.block.views_block.events-related:
      simpleConfigUpdate:
        versioned_properties.e2f2eaca342564e5:
          settings:
            default_settings:
              id: views_block:events-related
              label: 'Events: Related events'
              label_display: '0'
              provider: views
              views_label: ''
              items_per_page: null
              exposed: {  }
          fallback_metadata:
            slot_definitions: null
    canvas.component.block.views_block.news-latest:
      simpleConfigUpdate:
        versioned_properties.6815ab2dcfe29656:
          settings:
            default_settings:
              id: views_block:news-latest
