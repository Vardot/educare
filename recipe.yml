    # The Brand kit colours are Bootstrap's own --bs-* variables (config/canvas.color.*).
    # This global CSS derives what Bootstrap compiles to literals or rgb triplets.
    # setProperties saves the entity, which writes the CSS file.
    canvas.asset_library.global:
      setProperties:
        css.original: &educare_brand_kit_css |
          /* Educare brand kit: the Canvas Brand kit colours are Bootstrap's own --bs-* colour
             variables. Bootstrap compiles the rest to literals or rgb triplets, so this derives
             them from those colours: tints, utilities, buttons, focus rings and active states.
             :root:root and doubled classes win over the theme whatever the load order. */

          :root:root {
            --bs-success-text-emphasis: color-mix(in srgb, var(--bs-success) 40%, #000);
            --bs-success-bg-subtle: color-mix(in srgb, var(--bs-success) 20%, #fff);
            --bs-success-border-subtle: color-mix(in srgb, var(--bs-success) 40%, #fff);
            --bs-info-text-emphasis: color-mix(in srgb, var(--bs-info) 40%, #000);
            --bs-info-bg-subtle: color-mix(in srgb, var(--bs-info) 20%, #fff);
            --bs-info-border-subtle: color-mix(in srgb, var(--bs-info) 40%, #fff);
            --bs-warning-text-emphasis: color-mix(in srgb, var(--bs-warning) 40%, #000);
            --bs-warning-bg-subtle: color-mix(in srgb, var(--bs-warning) 20%, #fff);
            --bs-warning-border-subtle: color-mix(in srgb, var(--bs-warning) 40%, #fff);
            --bs-danger-text-emphasis: color-mix(in srgb, var(--bs-danger) 40%, #000);
            --bs-danger-bg-subtle: color-mix(in srgb, var(--bs-danger) 20%, #fff);
            --bs-danger-border-subtle: color-mix(in srgb, var(--bs-danger) 40%, #fff);
            --bs-primary-text-emphasis: var(--bs-dark);
            --bs-primary-border-subtle: var(--bs-primary);
            --bs-secondary-text-emphasis: var(--bs-border-color);
            --bs-secondary-bg-subtle: var(--bs-secondary);
            --bs-focus-ring-color: color-mix(in srgb, var(--bs-primary) calc(var(--bs-focus-ring-opacity, 0.25) * 100%), transparent);
            --bs-form-valid-color: var(--bs-success);
            --bs-form-valid-border-color: var(--bs-success);
            --bs-form-invalid-color: var(--bs-danger);
            --bs-form-invalid-border-color: var(--bs-danger);
          }

          /* Links: Bootstrap colours them from --bs-link-color-rgb. */
          :root :where(a) { color: color-mix(in srgb, var(--bs-link-color) calc(var(--bs-link-opacity, 1) * 100%), transparent); }
          :root :where(a:hover) { color: color-mix(in srgb, var(--bs-link-hover-color) calc(var(--bs-link-opacity, 1) * 100%), transparent); }
          .link-underline.link-underline { text-decoration-color: color-mix(in srgb, var(--bs-link-color) calc(var(--bs-link-underline-opacity, 1) * 100%), transparent) !important; }
          .icon-link.icon-link { text-decoration-color: color-mix(in srgb, var(--bs-link-color) calc(var(--bs-link-opacity, 0.5) * 100%), transparent); }

          /* Colour utilities, keeping the Bootstrap opacity modifiers. */
          .text-primary.text-primary { color: color-mix(in srgb, var(--bs-primary) calc(var(--bs-text-opacity, 1) * 100%), transparent) !important; }
          .bg-primary.bg-primary { background-color: color-mix(in srgb, var(--bs-primary) calc(var(--bs-bg-opacity, 1) * 100%), transparent) !important; }
          .border-primary.border-primary { border-color: color-mix(in srgb, var(--bs-primary) calc(var(--bs-border-opacity, 1) * 100%), transparent) !important; }
          .text-bg-primary.text-bg-primary { color: oklch(from var(--bs-primary) clamp(0, (0.65 - l) * 1000, 1) 0 0) !important; background-color: color-mix(in srgb, var(--bs-primary) calc(var(--bs-bg-opacity, 1) * 100%), transparent) !important; }
          .link-primary.link-primary { color: color-mix(in srgb, var(--bs-primary) calc(var(--bs-link-opacity, 1) * 100%), transparent) !important; text-decoration-color: color-mix(in srgb, var(--bs-primary) calc(var(--bs-link-underline-opacity, 1) * 100%), transparent) !important; }
          .link-primary.link-primary:is(:hover, :focus) { color: color-mix(in srgb, color-mix(in srgb, var(--bs-primary) 80%, #000) calc(var(--bs-link-opacity, 1) * 100%), transparent) !important; text-decoration-color: color-mix(in srgb, color-mix(in srgb, var(--bs-primary) 80%, #000) calc(var(--bs-link-underline-opacity, 1) * 100%), transparent) !important; }
          .link-underline-primary.link-underline-primary { text-decoration-color: color-mix(in srgb, var(--bs-primary) calc(var(--bs-link-underline-opacity, 1) * 100%), transparent) !important; }
          .focus-ring-primary.focus-ring-primary { --bs-focus-ring-color: color-mix(in srgb, var(--bs-primary) calc(var(--bs-focus-ring-opacity, 0.25) * 100%), transparent); }
