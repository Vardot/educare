          .border-secondary.border-secondary { border-color: color-mix(in srgb, var(--bs-secondary) calc(var(--bs-border-opacity, 1) * 100%), transparent) !important; }
          .text-bg-secondary.text-bg-secondary { color: oklch(from var(--bs-secondary) clamp(0, (0.65 - l) * 1000, 1) 0 0) !important; background-color: color-mix(in srgb, var(--bs-secondary) calc(var(--bs-bg-opacity, 1) * 100%), transparent) !important; }
