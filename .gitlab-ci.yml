################################################################################
# GitLab CI for the Educare site template recipe.
#
# Drupal CMS is the ONE AND ONLY host project. The Varbase host build was
# removed in issue #3622091: automated testing now runs on drupal/cms alone.
#
# build      - validate the recipe's composer.json.
# validate   - lint YAML, spell-check + ESLint the suite, and a Cucumber dry-run
#              that proves every step phrasing in the functional testing suite
#              resolves (all reproducible offline in gitlab-ci-local).
# pre-test   - 📦 Drupal CMS - Educare: build a drupal/cms
#              host project, require the checked-out Educare recipe from a path
#              repository, install it with `drush site:install recipes/educare`,
#              prepare it for deterministic testing, then DUMP the DB (gzip).
#              The built site (testsite/), the node_modules and the Playwright
#              browser are cached so the functional jobs reuse them instead of
#              rebuilding per job. THIS JOB GATES THE WHOLE SUITE.
# functional - one parallel functional job per feature bucket: pull the build
#              cache, restore the DB dump (seconds), serve the site and drive it
#              through the browser. No composer create-project / require /
#              site:install / npm install per job.
# report     - merge every bucket's cucumber JSON into one HTML + PDF report.
#
# Every job here is `allow_failure: false`: the install job gates the functional
# suite, so if it were allowed to fail the suite would be skipped and the
# pipeline would report GREEN while running ZERO tests. Keep it unmasked - no
# allow_failure, no `|| true` on the install command.
#
# = Automated Functional Acceptance Testing (@vardot/varbase-e2e) =
################################################################################

stages:
  - build
  - validate
  - pre-test
  - functional
  - report

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_MEMORY_LIMIT: "-1"
  COMPOSER_NO_INTERACTION: "1"
  DRUPAL_ADMIN_USERNAME: "webmaster"
  DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
  # The drupal/cms host site is built under testsite/ (this repo is a recipe,
  # not a docroot). drupal/cms sets bin-dir to vendor/bin, so drush lives at
  # $SITE_DIR/vendor/bin/drush - NOT $SITE_DIR/bin/drush as a Varbase project
  # would. $DRUSH is that path, used by every job.
  SITE_DIR: "$CI_PROJECT_DIR/testsite"
  WEB_ROOT: "$CI_PROJECT_DIR/testsite/web"
  DRUSH: "$CI_PROJECT_DIR/testsite/vendor/bin/drush"
  DB_URL: "mysql://drupal:drupal@database/drupal"
  LAUNCH_URL: "http://127.0.0.1:8888"
  FORCE_COLOR: "1"
  VARBASE_E2E_REPORT_DISABLE: "1"
  # Cache locations: composer downloads + the Playwright browser go inside the
  # project dir so the Install job can cache them for the pull-only test jobs.
  COMPOSER_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/composer"
  PLAYWRIGHT_BROWSERS_PATH: "${CI_PROJECT_DIR}/.cache/ms-playwright"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# = Path-based job gating (Reduce CI usage) ===================================
# Skip a job when the files it cares about did not change, but ALWAYS run the
# full pipeline on the default branch, release branches and tags. A job whose
# files did not change stays LISTED as a non-optional manual (allow_failure:
# false), never dropped.
.run_on_release_refs: &run_on_release_refs
  if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: on_success

# What a recipe developer edits: the recipe itself (recipe.yml / recommended.yml
# / config / content / scripts) and the functional testing suite + its config.
.recipe_app_changes: &recipe_app_changes
  - "composer.json"
  - ".gitlab-ci.yml"
  - ".gitlab-ci/**/*"
  - "recipe.yml"
  - "recommended.yml"
  - "config/**/*"
  - "content/**/*"
  - "scripts/**/*"
  - "tests/**/*"
  - "package.json"
  - "package-lock.json"
  - "cucumber.js"
  - "eslint.config.js"
  - "playwright.config.ts"

# Build cache populated by 📦 Drupal CMS - Educare: the built
# host site (testsite/), the node_modules and the composer + Playwright download
# caches. The functional jobs pull this (see .functional_cache) so they skip the
# whole host build and only restore the DB dump. One host now, so ONE key.
.build_cache: &build_cache
  key: "educare-cms-build-v1-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/composer
    - .cache/ms-playwright
    - testsite
    - node_modules

.functional_cache: &functional_cache
  key: "educare-cms-build-v1-$CI_COMMIT_REF_SLUG"
  policy: pull
  paths:
    - .cache/composer
    - .cache/ms-playwright
    - testsite
    - node_modules

# = Reusable before_script fragments =
.fragments:
  # The Playwright image is Ubuntu noble (PHP 8.3 default); add ondrej/php for
  # PHP 8.4, then PHP + Composer + ImageMagick/WebP + a MySQL client. Needed by
  # the Install job (build + drush) and by every test job (drush restore/serve).
  host_php_setup:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -y
    - apt-get install -y --no-install-recommends software-properties-common ca-certificates curl gnupg lsb-release
    - add-apt-repository -y ppa:ondrej/php
    - apt-get update -y
    - apt-get install -y --no-install-recommends php8.4-cli php8.4-mysql php8.4-gd php8.4-curl php8.4-xml php8.4-mbstring php8.4-zip php8.4-intl unzip git default-mysql-client webp imagemagick libmagickcore-6.q16-6-extra
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - corepack enable || true
    - composer --version && php --version
    - sed -i 's/rights="none"\s*pattern="WEBP"/rights="read|write" pattern="WEBP"/I' /etc/ImageMagick-*/policy.xml 2>/dev/null || true

# = build = validate the recipe's composer.json (schema + metadata, offline).
"📦 Composer validate":
  stage: build
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "composer.json"
      when: on_success
    # Its files did not change: keep the job LISTED as a manual (play button)
    # so it never auto-runs on unrelated changes but stays visible. allow_failure
    # stays false so that when it IS run it must pass.
    - when: manual
      allow_failure: false
  image: composer:2
  script:
    - composer --version
    - composer validate --no-check-all --no-check-publish

# = validate = lint every YAML file (recipe.yml + config/*) for syntax errors.
"📐 YAML lint":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "**/*.yml"
        - "**/*.yaml"
      when: on_success
    - when: manual
      allow_failure: false
  image: python:3.12-slim
  needs: []
  before_script:
    - pip install --no-cache-dir pyyaml
  script:
    - |
      python - <<'PY'
      import sys, yaml
      from pathlib import Path
      class Loader(yaml.SafeLoader):
          pass
      Loader.add_multi_constructor('', lambda loader, suffix, node: None)
      SKIP = ('node_modules/', '.cache/', 'tests/reports/', 'testsite/')
      errors = count = 0
      for path in sorted(Path('.').rglob('*.y*ml')):
          rel = str(path)
          if any(s in rel for s in SKIP):
              continue
          count += 1
          try:
              with open(path) as fh:
                  list(yaml.load_all(fh, Loader=Loader))
          except yaml.YAMLError as e:
              errors += 1
              print(f"INVALID: {rel}\n  {e}")
      print(f"Checked {count} YAML files, {errors} invalid.")
      sys.exit(1 if errors else 0)
      PY
  allow_failure: false

"🔤 Cspell":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "tests/**/*.feature"
        - "tests/README.md"
        - "cucumber.js"
        - "eslint.config.js"
        - ".cspell.json"
      when: on_success
    - when: manual
      allow_failure: false
  image: node:20
  needs: []
  before_script:
    - npm install -g cspell
  script:
    - cspell "tests/**/*.feature" "tests/README.md" "cucumber.js" "eslint.config.js" --no-progress
  allow_failure: false

"🟨 ESLint":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "**/*.js"
        - "eslint.config.js"
        - "package.json"
      when: on_success
    - when: manual
      allow_failure: false
  image: node:20
  needs: []
  before_script:
    - npm install --no-audit --no-fund
  script:
    - node --version
    - ./node_modules/.bin/eslint .

# = Cucumber dry-run = every step phrasing resolves, no browser, no site.
"🧩 Cucumber dry-run":
  stage: validate
  rules:
    - <<: *run_on_release_refs
    - changes:
        - "tests/**/*"
        - "cucumber.js"
        - "package.json"
      when: on_success
    - when: manual
      allow_failure: false
  image: node:20
  needs: []
  before_script:
    - npm install --no-audit --no-fund
  script:
    - VARBASE_E2E_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --dry-run

# = pre-test = build the drupal/cms host site, apply the Educare recipe, seed
# the site, dump the DB, and cache the built site + node_modules + browser.
# This is the ONLY host build, and it GATES the whole functional suite.
#
# HISTORY, worth keeping: this job used to abort with
#
#   Symfony\...\RuntimeException: You have requested a synthetic service
#   ("kernel"). The DIC does not know how to construct this service.
#
# Canvas installs canvas_page_template_component lazily, DURING
# RecipeAppliedEvent. Installing a module part-way through that event rebuilds
# the container, and in the rebuilt ContainerBuilder `kernel` is synthetic and
# unset, so the next hook resolution needing it threw. Declaring the module in
# the recipe's own `install:` list means it is installed before the event runs,
# so there is no mid-event rebuild. Fixed in #3622106; found first on Horizon
# Aid #3622092. If a future recipe change reintroduces a mid-event module
# install, this is the failure it will look like.
#
# `allow_failure: false`, here and in the manual rule below, is deliberate: the
# job gates the functional suite, so allowing it to fail would skip the suite
# and report GREEN while running ZERO tests. Do NOT mask it.
"📦 Drupal CMS - Educare":
  stage: pre-test
  rules:
    - <<: *run_on_release_refs
    - changes: *recipe_app_changes
      when: on_success
    # Its files did not change: keep the job LISTED as a non-optional manual
    # (play button). allow_failure stays false - when it IS run, it must pass.
    - when: manual
      allow_failure: false
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  needs: []
  timeout: 2h
  # composer pulls dists from github.com unauthenticated; a rate limit there is
  # transient, so let the runner re-attempt before the pipeline goes red.
  # `script_failure` was held back while the install could not pass at all; it
  # is restored now that it can (#3622106).
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  cache: *build_cache
  services:
    - name: mariadb:10.11
      alias: database
      variables:
        MARIADB_DATABASE: drupal
        MARIADB_USER: drupal
        MARIADB_PASSWORD: drupal
        MARIADB_ROOT_PASSWORD: root
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - educare-db.sql.gz
  before_script:
    - !reference [.fragments, host_php_setup]
  script:
    # = Build a Drupal CMS project, then require the checked-out recipe =
    # The build cache may restore a stale testsite/; composer create-project
    # refuses a non-empty target, so start from a clean dir on every run.
    - rm -rf "$SITE_DIR"
    - composer create-project drupal/cms "$SITE_DIR" --no-interaction --no-install --no-scripts
    - cd "$SITE_DIR"
    - composer config minimum-stability dev
    # Test THIS branch, not the published drupal/educare on Packagist.
    # symlink:false - the recipe must be COPIED in. A path-repo symlink points
    # recipes/educare back at $CI_PROJECT_DIR, which contains this build, and any
    # recursive scan then loops until "Too many levels of symbolic links". (See
    # the job removed in 3ce017b, issue #3618244.)
    - composer config repositories.educare '{"type":"path","url":"'"$CI_PROJECT_DIR"'","options":{"symlink":false}}' --json
    - composer require drupal/educare:@dev --no-interaction --no-progress --prefer-dist --with-all-dependencies
    # The recipe chain imports default content that writes into public://
    # (drupal_cms_admin_ui ships a login wallpaper). On a fresh CI checkout
    # sites/default is not writable, so site:install cannot create the files
    # directory and the import dies with "The specified file ... could not be
    # copied because the destination directory 'public://' is not properly
    # configured." Create it up front and make it writable.
    - mkdir -p "$WEB_ROOT/sites/default/files"
    - chmod -R 0777 "$WEB_ROOT/sites/default"
    # = Install the site from the Educare recipe =
    - $DRUSH site:install recipes/educare --db-url=$DB_URL
        --account-name=$DRUPAL_ADMIN_USERNAME --account-pass=$DRUPAL_ADMIN_PASSWORD
        --account-mail=webmaster@vardot.com --site-name="Educare" --locale=en -y
    # = Prepare for deterministic testing =
    - $DRUSH pm:uninstall antibot -y || true
    - $DRUSH config:set user.flood ip_limit 1000000 -y
    - $DRUSH config:set user.flood user_limit 1000000 -y
    - $DRUSH config:set system.logging error_level all -y
    - $DRUSH cache:rebuild
    # = Install the functional testing suite + the matching Chromium (cached) =
    - cd "$CI_PROJECT_DIR"
    - npm install --no-audit --no-fund
    - ./node_modules/.bin/playwright install chromium
    # = Dump the prepared DB for the parallel functional jobs =
    - $DRUSH --root=$WEB_ROOT sql:dump --gzip --result-file=$CI_PROJECT_DIR/educare-db.sql
  allow_failure: false

# = Automated Functional Acceptance Testing - one parallel job per feature
# bucket. Restores the built site + DB dump from
# 📦 Drupal CMS - Educare.
"🧪 Functional":
  stage: functional
  rules:
    - <<: *run_on_release_refs
    - changes: *recipe_app_changes
      when: on_success
    - when: manual
      allow_failure: false
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  needs: ["📦 Drupal CMS - Educare"]
  timeout: 2h
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  cache: *functional_cache
  parallel:
    matrix:
      - SUITE: "01-website-base-requirements"
        FEATURES_GLOB: "tests/features/01-website-base-requirements/**/*.feature"
      - SUITE: "02-news"
        FEATURES_GLOB: "tests/features/02-news/**/*.feature"
      - SUITE: "03-events"
        FEATURES_GLOB: "tests/features/03-events/**/*.feature"
      - SUITE: "04-programs"
        FEATURES_GLOB: "tests/features/04-programs/**/*.feature"
      - SUITE: "05-exposed-filters"
        FEATURES_GLOB: "tests/features/05-exposed-filters/**/*.feature"
      - SUITE: "06-contact"
        FEATURES_GLOB: "tests/features/06-contact/**/*.feature"
      - SUITE: "07-quality"
        FEATURES_GLOB: "tests/features/07-quality/**/*.feature"
      - SUITE: "08-seo"
        FEATURES_GLOB: "tests/features/08-seo/**/*.feature"
      - SUITE: "09-editorial"
        FEATURES_GLOB: "tests/features/09-editorial/**/*.feature"
      - SUITE: "10-01-canvas-pages-listed"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-01-canvas-pages-listed.feature"
      - SUITE: "10-02-canvas-home-about"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-02-canvas-editor-home-about.feature"
      - SUITE: "10-03-canvas-admissions-studentlife"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-03-canvas-editor-admissions-studentlife.feature"
      - SUITE: "10-04-canvas-research-contact"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-04-canvas-editor-research-contact.feature"
      - SUITE: "10-05-canvas-programs"
        FEATURES_GLOB: "tests/features/10-drupal-canvas/10-05-canvas-editor-programs.feature"
      - SUITE: "11-permissions"
        FEATURES_GLOB: "tests/features/11-permissions/**/*.feature"
      - SUITE: "12-search"
        FEATURES_GLOB: "tests/features/12-search/**/*.feature"
  services:
    - name: mariadb:10.11
      alias: database
      variables:
        MARIADB_DATABASE: drupal
        MARIADB_USER: drupal
        MARIADB_PASSWORD: drupal
        MARIADB_ROOT_PASSWORD: root
  variables:
    CUCUMBER_JSON: "cucumber_report--${SUITE}"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 30 days
  before_script:
    # testsite/ + node_modules + the browser arrive from the pull-only cache;
    # only PHP (for drush) is added, then the seeded DB dump is restored.
    - !reference [.fragments, host_php_setup]
    - gunzip -c $CI_PROJECT_DIR/educare-db.sql.gz | $DRUSH --root=$WEB_ROOT sql:cli
    - $DRUSH --root=$WEB_ROOT cache:rebuild
  script:
    # Serve the restored site (parallel workers for the Canvas editor mounts).
    - PHP_CLI_SERVER_WORKERS=8 $DRUSH --root=$WEB_ROOT runserver 127.0.0.1:8888 > $CI_PROJECT_DIR/runserver.log 2>&1 &
    - sleep 8
    - cd "$CI_PROJECT_DIR"
    # One feature bucket per matrix job. cucumber.js reads FEATURES.
    - FEATURES="${FEATURES_GLOB}" VARBASE_E2E_REPORT_DISABLE=1 CUCUMBER_JSON="cucumber_report--${SUITE}" ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  after_script:
    - cd "$CI_PROJECT_DIR"
    - export REPORT="educare--${CI_COMMIT_REF_SLUG:-local}--${SUITE}--automated-functional-testing-report--$(date +%Y-%m-%d)--$(date +%H-%M)"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js
        --json "tests/reports/cucumber_report--${SUITE}.json"
        --out  "tests/reports/${REPORT}.html"
        --format all
        --pdf-out "tests/reports/${REPORT}.pdf" || true
  allow_failure: false

# = report = merge every matrix job's cucumber JSON into one combined report.
"📊 Create reports":
  stage: report
  rules:
    # Auto-run whenever the test chain ran (release refs or the app changed),
    # even if a test failed, so the full report is published. DAG-scheduled via
    # needs so it is not held behind an un-played blocking-manual validate job.
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - changes: *recipe_app_changes
      when: always
    - when: never
  image: node:20
  needs: ["🧪 Functional"]
  dependencies:
    - "🧪 Functional"
  before_script:
    - apt-get update -y && apt-get install -y jq
    - npm install --no-save --no-audit --no-fund @vardot/varbase-e2e
    - ./node_modules/.bin/playwright install --with-deps chromium
  script:
    # The functional jobs are skipped when the install gate fails, leaving no
    # cucumber JSON. The glob would then reach jq unexpanded and this job would
    # go red for having nothing to do, masking the real failure upstream.
    - if ! ls tests/reports/cucumber_report--*.json >/dev/null 2>&1; then
        echo "No cucumber JSON was produced - the functional jobs did not run. Nothing to report.";
        exit 0;
      fi
    - jq -s 'add' tests/reports/cucumber_report--*.json > tests/reports/cucumber_report.json
    - export REPORT="educare--${CI_COMMIT_REF_SLUG}--automated-functional-testing-report--$(date +%Y-%m-%d)--$(date +%H-%M)"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  "tests/reports/${REPORT}.html"
        --format all
        --pdf-out "tests/reports/${REPORT}.pdf"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
    expire_in: 30 days
  allow_failure: false
