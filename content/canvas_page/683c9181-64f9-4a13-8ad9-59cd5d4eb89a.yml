    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: bf602a60-5415-46a2-b5aa-ab276afd2f9e
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: "<p>It's something many of us have experienced: You go on your phone to check something and - in the blink of an eye - you've been scrolling for an hour.</p>"
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: 84abd2e1-44e5-4568-85dd-a455681f2aee
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: '<p>People estimate more than a third of time on their phones is spent without a clear purpose, according to a new report.</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: 09a83447-b326-4f3a-9705-02d81098627c
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: '<p>Dr Eleanor Drage of Cambridge University said "this isn''t just a question of people making unwise choices," but that we are "undermined by the immersive nature of the technology".</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: c8a3f919-45b1-4596-87a4-8fd6861e0236
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: '<p>And while asking people to self-report their phone use can be unreliable, recognising our own habits is a "really important first step" to managing them, said Prof Pete Etchells of Bath Spa University.</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: 892551a2-e6b0-4751-9623-4c6a7346b117
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: '<p>Surveys commissioned by Virgin Media O2 found UK adults on average spent four hours per day on their phone, with 36% of this taking place unintentionally.</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: 3feb9439-4131-42e1-ad20-7601a3dabd9c
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: '<p>The report also revealed many people are aware of tools to control their screen time, but struggle to find the will to use them.</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: ecfdac81-e06d-4403-b899-ae33c3a66e21
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: '<p>"Despite growing awareness of the downsides of habitual and excessive device use, people struggle to successfully manage their time online," said Drage, a senior research fellow at the University of Cambridge.</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: f75445ef-f4a0-4ec6-a344-2a9460eb7944
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: '<p>Those surveyed reported their smartphone use was mostly intentional - comprising actions such as sending messages, using maps or checking the weather.</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: 38613108-0f71-4548-b2f8-600dec4ed892
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: '<p>But participants said they also spent time mindlessly scrolling or flicking through apps.</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
      slot: col_1
      uuid: 46e3787a-701b-407e-91dc-d9796d3a6ad0
      component_id: sdc.vartheme_bs5_educare.text
      inputs:
        text:
          value: '<p>The survey suggested those who said they spend more time using their phone without a clear reason were also were more likely to report negative experiences - including feeling worse afterwards or seeing harmful or unpleasant content.</p>'
          format: canvas_html_block
        text_size: none
        text_color: text-body
    -
      parent_uuid: 0be9328f-df28-4a04-9710-2d7d066263b7
