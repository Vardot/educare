  field_content:
    -
      value: '<p>The Chemistry program builds strong theoretical and laboratory foundations across organic, inorganic, physical, and analytical chemistry, preparing students for research and industry roles.</p><p>As an undergraduate program in Sciences, Chemistry prepares students through a blend of core theory, hands-on coursework, and applied or research projects, guided by faculty active in the field.</p><h3>What You&#39;ll Learn</h3><ul><li>Organic and inorganic chemistry</li><li>Physical and analytical chemistry</li><li>Laboratory safety and technique</li><li>Instrumentation and spectroscopy</li></ul><h3>Sample Courses</h3><ul><li>Organic Chemistry I & II</li><li>Physical Chemistry</li><li>Analytical Chemistry</li><li>Instrumental Methods Laboratory</li></ul><h3>Learning Outcomes</h3><p>Graduates of this program will be able to:</p><ul><li>Synthesize and characterize chemical compounds using standard laboratory techniques</li><li>Interpret spectroscopic and analytical data to determine molecular structure</li><li>Follow safe laboratory practice and proper chemical handling procedures</li></ul><h3>Career Paths</h3><p>Graduates go on to roles such as Laboratory chemist, Quality control analyst, and Pharmaceutical researcher. Many also pursue further graduate or professional study.</p><h3>Admission Notes</h3><p>Applicants should have completed relevant secondary-level coursework and demonstrate strong written communication and analytical skills; no prior specialization in the field is required.</p>'
