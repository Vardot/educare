  field_content:
    -
      value: '<p>This program examines the histories, cultures, and social experiences of African and African diasporic communities through an interdisciplinary lens spanning history, literature, sociology, and the arts.</p><p>As a graduate program in Arts & Humanities, African and African American Studies prepares students through a blend of core theory, hands-on coursework, and applied or research projects, guided by faculty active in the field.</p><h3>What You&#39;ll Learn</h3><ul><li>Comparative diaspora studies</li><li>Race, identity, and social movements</li><li>African and African American literature and the arts</li><li>Research methods in the humanities and social sciences</li></ul><h3>Sample Courses</h3><ul><li>Introduction to African Diaspora Studies</li><li>Black Political Thought</li><li>African American Literature</li><li>Research Seminar</li></ul><h3>Learning Outcomes</h3><p>Graduates of this program will be able to:</p><ul><li>Analyze primary and secondary sources across historical and cultural contexts</li><li>Situate contemporary social issues within their historical roots</li><li>Produce an original research paper grounded in archival or ethnographic evidence</li></ul><h3>Career Paths</h3><p>Graduates go on to roles such as Museum and archive careers, Public policy and advocacy, Academia and research, and Journalism and media.</p><h3>Admission Notes</h3><p>Applicants typically hold a bachelor''s degree in a related field and are asked to submit a statement of purpose, academic transcripts, and letters of recommendation; standardized test requirements vary by department.</p>'
