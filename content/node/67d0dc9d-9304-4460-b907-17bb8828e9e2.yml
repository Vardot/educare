      langcode: en
  field_content:
    -
      value: '<p>The School of Psychology has been awarded a three-year grant to study how sleep, screen time and classroom structure affect memory formation in secondary school students.</p><p>The study will follow roughly 400 students across six partner schools, combining short cognitive tasks with the kind of data schools already collect — attendance, timetabling, and assessment results — rather than asking teachers to run anything extra.</p><p>"We are not trying to add work for teachers," the principal investigator explained. "We are trying to answer a question a lot of them already ask us informally: does the timetable itself help or hurt."</p><p>Early findings are expected in the second year of the grant, with a full report due at its close.</p>'
      format: full_html
  field_description:
    -
      value: 'A three-year grant will fund a longitudinal study tracking how sleep, screen time and classroom structure affect memory formation in secondary school students.'
