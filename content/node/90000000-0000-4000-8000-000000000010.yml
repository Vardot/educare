  field_content:
    -
      value: '<p>This program bridges chemistry, physics, and biology to study living systems at the molecular level, preparing students for research at the interface of the physical and life sciences.</p><p>As an undergraduate program in Sciences, Chemical and Physical Biology prepares students through a blend of core theory, hands-on coursework, and applied or research projects, guided by faculty active in the field.</p><h3>What You&#39;ll Learn</h3><ul><li>Biophysical chemistry</li><li>Molecular and structural biology</li><li>Quantitative and computational methods</li><li>Laboratory research techniques</li></ul><h3>Sample Courses</h3><ul><li>Biophysical Chemistry</li><li>Structural Biology</li><li>Quantitative Methods in the Life Sciences</li><li>Independent Research Project</li></ul><h3>Learning Outcomes</h3><p>Graduates of this program will be able to:</p><ul><li>Apply physical and chemical principles to explain biological structure and function</li><li>Use quantitative and computational tools to analyze biological data</li><li>Design and execute an original interdisciplinary research project</li></ul><h3>Career Paths</h3><p>Graduates go on to roles such as Research scientist, and Biotech and pharmaceutical roles. Many also pursue further graduate or professional study.</p><h3>Admission Notes</h3><p>Applicants should have completed relevant secondary-level coursework and demonstrate strong written communication and analytical skills; no prior specialization in the field is required.</p>'
