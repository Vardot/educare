  field_content:
    -
      value: '<p>This program combines studio practice, film production, and critical theory, giving students the tools to create and analyze visual media across traditional and digital forms.</p><p>As a graduate program in Arts & Humanities, Art, Film, and Visual Studies prepares students through a blend of core theory, hands-on coursework, and applied or research projects, guided by faculty active in the field.</p><h3>What You&#39;ll Learn</h3><ul><li>Studio art and visual composition</li><li>Film production and editing</li><li>Critical and cultural theory of visual media</li><li>Curatorial and exhibition practice</li></ul><h3>Sample Courses</h3><ul><li>Studio Practice Seminar</li><li>Film Production Workshop</li><li>Visual Culture and Theory</li><li>Thesis Exhibition/Screening</li></ul><h3>Learning Outcomes</h3><p>Graduates of this program will be able to:</p><ul><li>Produce an original body of creative work in a chosen medium</li><li>Critically analyze visual and cinematic works within cultural and historical contexts</li><li>Present and defend a thesis project to a faculty panel</li></ul><h3>Career Paths</h3><p>Graduates go on to roles such as Filmmaker, Curator, Visual artist, Creative director, and Arts educator.</p><h3>Admission Notes</h3><p>Applicants typically hold a bachelor''s degree in a related field and are asked to submit a statement of purpose, academic transcripts, and letters of recommendation; standardized test requirements vary by department.</p>'
