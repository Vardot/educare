  field_content:
    -
      value: '<p>This program examines literary traditions across languages and cultures, developing critical reading, translation, and comparative analysis skills.</p><p>As an undergraduate program in Arts & Humanities, Comparative Literature prepares students through a blend of core theory, hands-on coursework, and applied or research projects, guided by faculty active in the field.</p><h3>What You&#39;ll Learn</h3><ul><li>World literary traditions</li><li>Literary theory and criticism</li><li>Translation studies</li><li>Cross-cultural and comparative analysis</li></ul><h3>Sample Courses</h3><ul><li>World Literature Seminar</li><li>Literary Theory</li><li>Translation Workshop</li><li>Comparative Literature Thesis</li></ul><h3>Learning Outcomes</h3><p>Graduates of this program will be able to:</p><ul><li>Compare literary works across at least two languages or traditions</li><li>Apply literary theory to close readings of primary texts</li><li>Produce a substantial piece of original literary criticism</li></ul><h3>Career Paths</h3><p>Graduates go on to roles such as Publishing and editing, Translation and localization, and Education. Many also pursue further graduate or professional study.</p><h3>Admission Notes</h3><p>Applicants should have completed relevant secondary-level coursework and demonstrate strong written communication and analytical skills; no prior specialization in the field is required.</p>'
