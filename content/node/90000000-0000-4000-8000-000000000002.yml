  field_content:
    -
      value: '<p>Students in the Anthropology program study human societies, cultures, and their development across time, drawing on cultural, biological, linguistic, and archaeological perspectives.</p><p>As a graduate program in Social Sciences, Anthropology prepares students through a blend of core theory, hands-on coursework, and applied or research projects, guided by faculty active in the field.</p><h3>What You&#39;ll Learn</h3><ul><li>Ethnographic methods and fieldwork</li><li>Human evolution and biological anthropology</li><li>Linguistic anthropology</li><li>Archaeological methods and material culture</li></ul><h3>Sample Courses</h3><ul><li>Ethnographic Field Methods</li><li>Human Origins</li><li>Language and Culture</li><li>Archaeological Theory and Practice</li></ul><h3>Learning Outcomes</h3><p>Graduates of this program will be able to:</p><ul><li>Design and conduct ethnographic or archaeological fieldwork</li><li>Critically evaluate cultural and biological explanations of human diversity</li><li>Present research findings using discipline-appropriate methods</li></ul><h3>Career Paths</h3><p>Graduates go on to roles such as Fieldwork researcher, Museum curator, Policy analyst, and International development specialist.</p><h3>Admission Notes</h3><p>Applicants typically hold a bachelor''s degree in a related field and are asked to submit a statement of purpose, academic transcripts, and letters of recommendation; standardized test requirements vary by department.</p>'
