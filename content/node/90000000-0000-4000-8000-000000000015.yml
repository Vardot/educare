  field_content:
    -
      value: '<p>Students examine religious traditions, texts, and practices across cultures and historical periods, developing critical and comparative approaches to belief and ritual.</p><p>As an undergraduate program in Arts & Humanities, Comparative Study of Religion prepares students through a blend of core theory, hands-on coursework, and applied or research projects, guided by faculty active in the field.</p><h3>What You&#39;ll Learn</h3><ul><li>World religious traditions</li><li>Sacred texts and their interpretation</li><li>Religion, ethics, and society</li><li>Comparative methods in religious studies</li></ul><h3>Sample Courses</h3><ul><li>Introduction to World Religions</li><li>Sacred Texts Seminar</li><li>Religion and Ethics</li><li>Comparative Methods</li></ul><h3>Learning Outcomes</h3><p>Graduates of this program will be able to:</p><ul><li>Compare religious traditions using appropriate historical and cultural context</li><li>Interpret primary religious texts using established scholarly methods</li><li>Write an evidence-based comparative research essay</li></ul><h3>Career Paths</h3><p>Graduates go on to roles such as Interfaith and community relations, Education, and Nonprofit and NGO work. Many also pursue further graduate or professional study.</p><h3>Admission Notes</h3><p>Applicants should have completed relevant secondary-level coursework and demonstrate strong written communication and analytical skills; no prior specialization in the field is required.</p>'
