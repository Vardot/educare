  field_content:
    -
      value: '<p>The History program develops the skills to research, interpret, and write about the past, with opportunities to specialize in regional, thematic, or comparative fields.</p><p>As a graduate program in Social Sciences, History prepares students through a blend of core theory, hands-on coursework, and applied or research projects, guided by faculty active in the field.</p><h3>What You&#39;ll Learn</h3><ul><li>Historiography and historical methods</li><li>Archival research</li><li>Comparative and global history</li><li>Historical writing and argumentation</li></ul><h3>Sample Courses</h3><ul><li>Historical Methods</li><li>Global History Seminar</li><li>Archival Research Practicum</li><li>Thesis Workshop</li></ul><h3>Learning Outcomes</h3><p>Graduates of this program will be able to:</p><ul><li>Evaluate primary sources critically and situate them in historical context</li><li>Construct evidence-based historical arguments in written form</li><li>Complete an original research thesis under faculty supervision</li></ul><h3>Career Paths</h3><p>Graduates go on to roles such as Archivist, Museum professional, Policy researcher, Educator, and Journalist.</p><h3>Admission Notes</h3><p>Applicants typically hold a bachelor''s degree in a related field and are asked to submit a statement of purpose, academic transcripts, and letters of recommendation; standardized test requirements vary by department.</p>'
