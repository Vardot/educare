  field_content:
    -
      value: '<p>The English program develops close reading, critical writing, and analytical skills through the study of literature, language, and rhetoric across periods and genres.</p><p>As an undergraduate program in Arts & Humanities, English prepares students through a blend of core theory, hands-on coursework, and applied or research projects, guided by faculty active in the field.</p><h3>What You&#39;ll Learn</h3><ul><li>British and American literary traditions</li><li>Literary theory and criticism</li><li>Rhetoric and composition</li><li>Creative and critical writing</li></ul><h3>Sample Courses</h3><ul><li>Survey of English Literature</li><li>Literary Theory and Criticism</li><li>Advanced Composition</li><li>Senior Thesis Seminar</li></ul><h3>Learning Outcomes</h3><p>Graduates of this program will be able to:</p><ul><li>Analyze literary texts using appropriate critical frameworks</li><li>Write clear, well-supported critical and creative prose</li><li>Complete an independent research or creative thesis</li></ul><h3>Career Paths</h3><p>Graduates go on to roles such as Writer and editor, Publishing professional, Educator, and Communications specialist. Many also pursue further graduate or professional study.</p><h3>Admission Notes</h3><p>Applicants should have completed relevant secondary-level coursework and demonstrate strong written communication and analytical skills; no prior specialization in the field is required.</p>'
